name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts
      - run: npm test
      - uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.13.0
      - name: Build Zig session executor
        run: zig build
        working-directory: zig-executor
      - name: Run Zig executor integration tests
        run: sh test.sh
        working-directory: zig-executor
